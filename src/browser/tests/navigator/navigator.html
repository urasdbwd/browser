<!DOCTYPE html>
<script src="../testing.js"></script>

<script id=pluginMimeIdentity>
  {
    testing.expectEqual(false, navigator.plugins[0][0] === navigator.mimeTypes[0]);
    testing.expectEqual(false, navigator.plugins[0][0] === navigator.plugins[1][0]);
    testing.expectEqual(true, navigator.plugins[0][0].enabledPlugin === navigator.plugins[0]);
    testing.expectEqual(true, navigator.plugins[1][0].enabledPlugin === navigator.plugins[1]);
    testing.expectEqual(true, navigator.mimeTypes[0].enabledPlugin === navigator.plugins[0]);
  }
</script>

<script id=navigator>
  testing.expectEqual(false, Object.hasOwn(navigator, Symbol.toStringTag));
  const toStringTag = Object.getOwnPropertyDescriptor(Navigator.prototype, Symbol.toStringTag);
  testing.expectEqual('Navigator', toStringTag.value);
  testing.expectEqual(false, toStringTag.writable);
  testing.expectEqual(false, toStringTag.enumerable);
  testing.expectEqual(true, toStringTag.configurable);

  // Navigator should be accessible from window
  testing.expectEqual(navigator, window.navigator);
  testing.expectEqual(true, navigator.userAgent.length > 0);
  testing.expectEqual(true, navigator.userAgent.includes('Lightpanda'));
  testing.expectEqual('Netscape', navigator.appName);
  testing.expectEqual('1.0', navigator.appVersion);
  testing.expectEqual(true, navigator.platform.length > 0);

  // Platform should be one of the known values
  const validPlatforms = ['MacIntel', 'Win32', 'Linux x86_64', 'FreeBSD', 'Unknown'];
  testing.expectEqual(true, validPlatforms.includes(navigator.platform));
  testing.expectEqual('en-US', navigator.language);
  testing.expectEqual(true, Array.isArray(navigator.languages));
  testing.expectEqual(2, navigator.languages.length);
  testing.expectEqual('en-US', navigator.languages[0]);
  testing.expectEqual('en', navigator.languages[1]);
  testing.expectTrue(navigator.languages === navigator.languages);
  testing.expectTrue(Object.isFrozen(navigator.languages));
  testing.expectEqual(true, navigator.onLine);
  testing.expectEqual(true, navigator.cookieEnabled);
  testing.expectEqual(true, navigator.hardwareConcurrency > 0);
  // Chrome always exposes deviceMemory; its absence is a headless tell.
  testing.expectEqual('number', typeof navigator.deviceMemory);
  testing.expectEqual(true, navigator.deviceMemory > 0);
  testing.expectEqual(0, navigator.maxTouchPoints);
  testing.expectEqual('', navigator.vendor);
  testing.expectEqual('Gecko', navigator.product);
  testing.expectEqual(false, navigator.javaEnabled());
  // Must stay false: Chrome only sets it under a WebDriver session, and it is
  // the single loudest automation signal a page can read.
  testing.expectEqual(false, navigator.webdriver);

  testing.expectEqual(null, navigator.doNotTrack);

  // GPC must default to false — per https://w3c.github.io/gpc/#javascript-property
  // the signal reflects an explicit user preference (Firefox defaults to false;
  // Chrome doesn't expose the property at all). A true default makes
  // GPC-compliant consent managers reject-all and skip their consent UI.
  testing.expectEqual(false, navigator.globalPrivacyControl);

  // Every Navigator attribute must be a native accessor on the prototype
  for (const name of [
    'userAgent', 'appName', 'appCodeName', 'appVersion', 'platform',
    'language', 'languages', 'onLine', 'cookieEnabled', 'hardwareConcurrency',
    'maxTouchPoints', 'vendor', 'product', 'webdriver', 'plugins', 'doNotTrack',
    'globalPrivacyControl',
  ]) {
    const desc = Object.getOwnPropertyDescriptor(Navigator.prototype, name);
    testing.expectEqual('function', typeof desc.get); // accessor on prototype
    testing.expectEqual(undefined, desc.value);        // not a data property
    testing.expectEqual(undefined, Object.getOwnPropertyDescriptor(navigator, name)); // not own
    testing.expectEqual(true, desc.get.toString().includes('[native code]'));
  }
</script>

<script id=navigator_native_descriptor_walk>
  // Read every navigator property's descriptor and call toString() on its
  // value/getter. This must not throw.
  let obj = navigator;
  do {
    for (const name of Object.getOwnPropertyNames(obj)) {
      const d = Object.getOwnPropertyDescriptor(obj, name);
      if (d.value !== undefined) { d.value.toString(); }
      else if (d.get !== undefined) { d.get.toString(); }
    }
  } while (obj = Object.getPrototypeOf(obj));
  testing.expectEqual(null, navigator.doNotTrack);
</script>

<script id=permission_query type=module>
  {
    const state = await testing.async();
    const p = navigator.permissions.query({ name: 'notifications' });
    testing.expectTrue(p instanceof Promise);
    const status = await p;
    state.resolve();

    await state.done(() => {
      testing.expectEqual('prompt', status.state);
      testing.expectEqual('notifications', status.name);
    });
  }

  {
    const query = Permissions.prototype.query;
    let promise;
    try {
      promise = query.call({ name: "not Permissions" }, { name: "notifications" });
    } catch (error) {
      testing.fail(`Permissions.query brand check threw synchronously: ${error}`);
    }
    try {
      await promise;
      testing.fail("Permissions.query accepted an invalid receiver");
    } catch (error) {
      testing.expectTrue(error instanceof TypeError);
      testing.expectEqual("Failed to execute 'query' on 'Permissions': Illegal invocation", error.message);
    }
  }
</script>

<script id=permission_query_unknown type=module>
  {
    const state = await testing.async();
    let rejected = false;
    try {
      await navigator.permissions.query({ name: 'not-a-real-permission' });
    } catch (err) {
      rejected = err instanceof TypeError;
    }
    state.resolve();

    await state.done(() => {
      testing.expectTrue(rejected);
    });
  }
</script>

<script id=storage_estimate type=module>
  {
    const state = await testing.async();

    const p = navigator.storage.estimate();
    testing.expectTrue(p instanceof Promise);

    const estimate = await p;
    state.resolve();

    await state.done(() =>{
      testing.expectEqual(0, estimate.usage);
      testing.expectEqual(1024 * 1024 * 1024, estimate.quota);
    });
  }
</script>

<script id=plugins_mimeTypes>
{
  // Chrome reports exactly these five PDF-viewer plugins; an empty
  // navigator.plugins is a classic headless tell.
  testing.expectEqual(5, navigator.plugins.length);
  testing.expectEqual('PDF Viewer', navigator.plugins[0].name);
  testing.expectEqual(2, [...navigator.plugins[0]].length);
  testing.expectEqual(navigator.plugins[0][0], [...navigator.plugins[0]][0]);
  let count = 0;
  for (const _ of navigator.plugins) count++;
  testing.expectEqual(navigator.plugins.length, count);
  testing.expectEqual(2, navigator.mimeTypes.length);
  testing.expectEqual('application/pdf', navigator.mimeTypes[0].type);
  testing.expectEqual('PDF Viewer', navigator.mimeTypes[0].enabledPlugin.name);
  testing.expectEqual(5, Object.keys({...navigator.plugins}).length);
  testing.expectEqual(2, Object.keys({...navigator.mimeTypes}).length);
  testing.expectEqual('0,1,2,3,4', Object.keys(navigator.plugins).join(','));
  testing.expectEqual('0,1', Object.keys(navigator.plugins[0]).join(','));
  testing.expectEqual('0,1', Object.keys(navigator.mimeTypes).join(','));
  const namedPlugin = Object.getOwnPropertyDescriptor(navigator.plugins, 'PDF Viewer');
  testing.expectEqual(false, namedPlugin.enumerable);
  testing.expectEqual(false, namedPlugin.writable);
  const namedMime = Object.getOwnPropertyDescriptor(navigator.mimeTypes, 'application/pdf');
  testing.expectEqual(false, namedMime.enumerable);
  testing.expectEqual(false, namedMime.writable);
  testing.expectEqual(true, 'ContentIndex' in window);
}
</script>

<script id=notification_permissions_consistency type=module>
{
  const state = await testing.async();
  const status = await navigator.permissions.query({ name: "notifications" });
  state.resolve();
  await state.done(() => {
    // Notification.permission "default" maps to permissions "prompt".
    testing.expectEqual("default", Notification.permission);
    testing.expectEqual("prompt", status.state);
    // Classic headless bug is denied/prompt mismatch — neither here.
    testing.expectEqual(false, Notification.permission === "denied" && status.state === "prompt");
  });
}
</script>

<script id=userAgentData>
  testing.expectEqual(true, navigator.userAgentData !== undefined);
  testing.expectEqual(false, navigator.userAgentData.mobile);
  testing.expectEqual(true, navigator.userAgentData.platform.length > 0);

  const validUAPlatforms = ['macOS', 'Windows', 'Linux', 'FreeBSD', 'Unknown'];
  testing.expectEqual(true, validUAPlatforms.includes(navigator.userAgentData.platform));

  testing.expectEqual(1, navigator.userAgentData.brands.length);
  testing.expectEqual({brand: 'Lightpanda', version: "1"}, navigator.userAgentData.brands[0]);

  // Same instance returned on repeated access
  testing.expectEqual(true, navigator.userAgentData === navigator.userAgentData);

  const json = navigator.userAgentData.toJSON();
  testing.expectTrue(navigator.userAgentData.brands === navigator.userAgentData.brands);
  testing.expectTrue(Object.isFrozen(navigator.userAgentData.brands));
  testing.expectEqual(false, json.mobile);
  testing.expectEqual(navigator.userAgentData.platform, json.platform);
  testing.expectEqual(true, Array.isArray(json.brands));
  testing.expectEqual('Lightpanda', json.brands[0].brand);
</script>

<script id=userAgentData_highEntropy type=module>
  {
    const state = await testing.async();
    const p = navigator.userAgentData.getHighEntropyValues(['architecture', 'platformVersion', 'fullVersionList']);
    testing.expectTrue(p instanceof Promise);
    const v = await p;
    state.resolve();

    await state.done(() => {
      testing.expectEqual(false, v.mobile);
      testing.expectEqual(navigator.userAgentData.platform, v.platform);
      testing.expectEqual(true, Array.isArray(v.brands));
      testing.expectEqual(true, typeof v.architecture === 'string');
      testing.expectEqual(true, typeof v.platformVersion === 'string');
      testing.expectEqual(true, Array.isArray(v.fullVersionList));
      testing.expectEqual('Lightpanda', v.fullVersionList[0].brand);
      testing.expectEqual('1.0', v.fullVersionList[0].version);
      testing.expectEqual(false, 'bitness' in v);
      testing.expectEqual(false, 'model' in v);
      testing.expectEqual(false, 'uaFullVersion' in v);
      testing.expectEqual(false, 'wow64' in v);
      testing.expectEqual(false, 'formFactors' in v);
    });
  }
</script>

<script id=userAgentData_highEntropy_formFactors type=module>
  {
    const state = await testing.async();
    const v = await navigator.userAgentData.getHighEntropyValues([
      'formFactors',
      'uaFullVersion',
      'wow64',

    state.resolve();

    await state.done(() => {

      testing.expectEqual('1.0', v.uaFullVersion);

    });
  }
</script>

<script id=frozen_arrays_ignore_overridden_intrinsics>
  const originalObject = Object;
  Object.freeze = () => "overridden";
  globalThis.Object = null;

  const languages = navigator.languages;
  const brands = navigator.userAgentData.brands;

  globalThis.Object = originalObject;
  testing.expectTrue(Array.isArray(languages));
  testing.expectTrue(Array.isArray(brands));
  testing.expectTrue(Object.isFrozen(languages));
  testing.expectTrue(Object.isFrozen(brands));
</script>

<script id=getBattery type=module>
  // Chrome exposes navigator.getBattery, and headless-detection heuristics
  // treat its absence as a signal. Values come from the fingerprint seed.
  const state = await testing.async();
  const battery = await navigator.getBattery();
  state.resolve();
  await state.done(() => {
    testing.expectEqual('function', typeof navigator.getBattery);
    testing.expectEqual('boolean', typeof battery.charging);
    testing.expectEqual(true, battery.level > 0 && battery.level <= 1);
  });
</script>
