<!DOCTYPE html>
<script src="../testing.js"></script>

<script id=postMessageStructuredClone type=module>
// window.postMessage delivers a structured clone: the receiver gets a fresh,
// independent copy, not the literal object the sender posted.
{
    const state = await testing.async();
    const payload = { n: 1 };
    let received = null;

    window.addEventListener('message', (e) => {
        // Other scripts in this file post to the same window; ours is an object.
        if (typeof e.data !== 'object') return;
        received = e.data;
        state.resolve();
    });

    window.postMessage(payload, '*');

    await state.done(() => {
        testing.expectEqual(false, received === payload);
        testing.expectEqual(1, received.n);
        // Mutating the sender's object after posting doesn't affect the clone.
        payload.n = 999;
        testing.expectEqual(1, received.n);
    });
}
</script>

<script id=postMessageTargetOrigin type=module>
// targetOrigin gates delivery: "*" and the window's own origin (explicit, or
// via "/", or by omission) are delivered; any other origin is dropped.
{
    const state = await testing.async();
    const received = [];

    window.addEventListener('message', (e) => {
        // Other scripts in this file post to the same window; ours are strings.
        if (typeof e.data !== 'string') return;
        received.push(e.data);
        if (e.data === 'last') {
            testing.expectEqual(testing.ORIGIN, e.origin);
            testing.expectEqual(window, e.source);
            state.resolve();
        }
    });

    window.postMessage('exact', testing.ORIGIN);
    window.postMessage('slash', '/');
    window.postMessage('omitted');
    window.postMessage('other-host', 'http://example.com');
    window.postMessage('other-port', testing.ORIGIN + '1');
    window.postMessage('other-scheme', testing.ORIGIN.replace('http:', 'https:'));
    window.postMessage('last', '*');

    await state.done(() => {
        testing.expectEqual(['exact', 'slash', 'omitted', 'last'], received);
    });
}
</script>

<script id=postMessageOptionsOverload type=module>
// An object second argument selects WindowPostMessageOptions. Arrays are also
// objects, so Chrome accepts the reCAPTCHA-style postMessage(message, [port])
// call and applies the options defaults instead of parsing the array as a URL.
{
    const state = await testing.async();
    const received = [];

    window.addEventListener('message', (e) => {
        if (!e.data.startsWith('options-')) return;
        received.push([e.data, e.ports.length]);
        if (received.length === 2) state.resolve();
    });

    const ignored = new MessageChannel();
    window.postMessage('options-array', [ignored.port2]);

    const transferred = new MessageChannel();
    window.postMessage('options-object', {
        targetOrigin: '*',
        transfer: [transferred.port2],
    });

    await state.done(() => {
        testing.expectEqual([
            ['options-array', 0],
            ['options-object', 1],
        ], received);
    });
}
</script>

<script id=postMessageTargetOriginSyntaxError>
// A targetOrigin that isn't a URL at all throws, rather than silently dropping.
{
    for (const bad of ['example.com', '//example.com']) {
        testing.withError((e) => testing.expectEqual('SyntaxError', e.name), () => {
            window.postMessage('x', bad);
        });
    }
}
</script>

<script id=postMessageDataCloneError>
// A value that cannot be structured-cloned throws synchronously (DataCloneError).
{
    let threw = false;
    try {
        window.postMessage(function () {}, '*');
    } catch (e) {
        threw = true;
        testing.expectEqual('DataCloneError', e.name);
    }
    testing.expectEqual(true, threw);
}
</script>
