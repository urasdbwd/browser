<!DOCTYPE html>
<script src="../testing.js"></script>

<script id=replaceable>
    "use strict";
    // console is [Replaceable] (Console Standard): assignment must replace it
    // even in strict mode — neither throwing nor silently no-op'ing, and even
    // after console has already been read.
    const prev = window.console;
    window.console = {marker: 42};
    testing.expectEqual(42, window.console.marker);
    testing.expectEqual(42, console.marker);
    // restore: console is now a writable data property, so this just overwrites it.
    window.console = prev;
    testing.expectEqual(true, window.console === prev);
</script>

<script id=entries>
    {
        const entries = Object.entries(console);
        testing.expectEqual(true, entries.length > 10);

        const log_entry = entries.find((e) => e[0] == 'log');
        testing.expectEqual(true, log_entry[1] === console.log);
    }
</script>

<script id="time">
    // should not crash
    console.time();
    console.timeLog();
    console.timeEnd();

    console.time("test");
    console.timeLog("test");
    console.timeEnd("test");

    testing.expectEqual(true, true);
</script>

<script id="count">
    // should not crash
    console.count();
    console.count();
    console.countReset();

    console.count("test");
    console.count("test");
    console.countReset("test");

    testing.expectEqual(true, true);
</script>

<script id="static_no_this_binding">
    // console members are static namespace operations, so a detached or
    // rebound reference must work instead of throwing Illegal invocation.
    // Sentry, Nuxt and every "const { log } = console" in the wild rely on it,
    // and a brand check here is a trivial headless tell.
    {
        const log = console.log;
        log("detached");
        log.call(null, "call-null");
        log.call(undefined, "call-undefined");
        log.apply({}, ["apply-obj"]);
        console.log.bind({})("bound-obj");

        // stateful members reach their state through the execution scope
        const time = console.time, timeEnd = console.timeEnd;
        const count = console.count, countReset = console.countReset;
        time.call(null, "detached-timer");
        timeEnd.call(null, "detached-timer");
        count.call(null, "detached-count");
        countReset.call(null, "detached-count");

        testing.expectEqual(true, true);
    }
</script>

<script id="group">
    // should not crash
    console.group();
    console.groupEnd();

    console.group("outer");
    console.group("inner");
    console.log("nested");
    console.groupEnd();
    console.groupEnd();

    console.groupCollapsed("collapsed");
    console.log("inside collapsed");
    console.groupEnd();

    // groupEnd beyond depth 0 should not crash
    console.groupEnd();

    testing.expectEqual(true, true);
</script>
